# server/docker-compose.yml
#
# Local dev stack — Flask API + React frontend + Grafana observability.
# Video streaming is NOT included here; run it from streaming/ instead.
#
# For video streams alongside this stack:
#   cd streaming/ && docker compose up -d
# Then set in server/.env:
#   MEDIAMTX_RTSP_URL=rtsp://host.docker.internal:8554/telescope-camera

services:
  api:
    build: .
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      FLASK_HOST: 0.0.0.0
      FLASK_DEBUG: "false"
      PORT: "8080"
      THINGSPEAK_API_BASE_URL: https://api.thingspeak.com
      THINGSPEAK_CHANNEL_ID: "270748"
      ALPACA_BASE: http://host.docker.internal:32323/api/v1/telescope/0
      ASCOM_BASE_URL: http://host.docker.internal:32323
      CLIENT_ID: "1"
      CAPTURES_DIR: /data/captures
      # Override when MediaMTX runs on a separate host:
      # MEDIAMTX_RTSP_URL: rtsp://host.docker.internal:8554/telescope-camera
      CORS_ORIGINS: "http://localhost:5173,http://127.0.0.1:5173,https://localhost,https://localhost:8443"
    restart: unless-stopped
    networks:
      - cse3cap-rsdcc
    volumes:
      - ./app/oapi.yaml:/app/app/oapi.yaml:ro
      - ./captures:/data/captures

  frontend:
    build:
      context: ../client
      dockerfile: Dockerfile
      args:
        VITE_API_URL: https://localhost:8443
    ports:
      - "5173:80"
    networks:
      - cse3cap-rsdcc
    restart: unless-stopped

  nginx-proxy:
    image: nginx:alpine
    ports:
      - "443:443"
      - "8443:8443"
      - "3443:3443"
    volumes:
      - ./nginx-proxy.conf:/etc/nginx/conf.d/default.conf:ro
      - ../certs:/etc/nginx/certs:ro
    depends_on:
      - api
      - frontend
      - otel-lgtm
    networks:
      - cse3cap-rsdcc
    restart: unless-stopped

  otel-lgtm:
    image: grafana/otel-lgtm:latest
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SMTP_ENABLED=true
      - GF_SMTP_HOST=sandbox.smtp.mailtrap.io:2525
      - GF_SMTP_USER=00a9ce522425fd
      - GF_SMTP_PASSWORD=44c848846b9607
      - GF_SMTP_SKIP_VERIFY=true
      - GF_SMTP_FROM_ADDRESS=grafana@cse3cap-rsdcc.com
    volumes:
      - lgtm-data:/data
    networks:
      - cse3cap-rsdcc
    restart: unless-stopped

volumes:
  lgtm-data:

networks:
  cse3cap-rsdcc:
    driver: bridge
